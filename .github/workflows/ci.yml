name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Formatting, platform boundary and TypeScript parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm run format:check
      - run: node src/tooling/check-platform-boundary.mjs
      - run: node src/tooling/check-package-boundary.mjs
      - run: node src/tooling/check-clients.mjs
      - run: node src/tooling/check-test-paths.mjs
      - run: pnpm run typecheck
      - run: pnpm run test:ts
      - run: pnpm run test:mcp

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The desktop crate embeds the built front end.
      - run: pnpm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # tauri-build requires the bundled resource folder; the packaged engine
      # and MCP relay are not needed to check or test.
      - name: Resource folder
        shell: bash
        run: mkdir -p src/apps/desktop/src-tauri/resources
      # Each host's own adapters only compile, and are only linted, on that host.
      - run: cargo clippy --workspace --tests --locked -- -D warnings
      # Every crate runs, so one run shows every failure.
      - run: cargo test --workspace --locked --no-fail-fast
