name: Rerun CI jobs that never started

# GitHub's hosted macOS arm64 runners run short at busy hours. A job that finds
# no runner within about 15 minutes is dropped: it ends cancelled with no steps
# ("The job was not acquired by Runner of type hosted even after multiple
# attempts"), and the CI run fails though nothing in it failed. Such a run is
# queued again, at most twice. A run with a job that ran and failed stays failed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Rerun the run if its only failures never got a runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100")
          failed=$(jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")]' <<<"$jobs")
          unstarted=$(jq '[.[] | select((.steps | length) == 0 and (.runner_name // "") == "")]' <<<"$failed")
          jq -r '.[] | "\(.name): \(.conclusion), \(.steps | length) steps"' <<<"$failed"
          if [ "$(jq length <<<"$failed")" -gt 0 ] && [ "$(jq length <<<"$failed")" = "$(jq length <<<"$unstarted")" ]; then
            gh run rerun "$RUN_ID" --failed
          else
            echo "A job ran and failed, so the run stays failed."
          fi
