[workspace]
members = ["src/crates/*", "src/apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.lints.clippy]
# Database rows and HUD geometry pass many plain values; naming each tuple
# or bundling arguments into one-off structs would not make them clearer.
too_many_arguments = "allow"
type_complexity = "allow"

# Every crate takes these from here, so one version serves the workspace.
[workspace.dependencies]
agent-hud-agents = { path = "src/crates/agents" }
agent-hud-core = { path = "src/crates/core" }
agent-hud-host = { path = "src/crates/host" }
agent-hud-hud = { path = "src/crates/hud" }
agent-hud-l10n = { path = "src/crates/l10n" }
agent-hud-lan = { path = "src/crates/lan" }
agent-hud-platform = { path = "src/crates/platform" }
agent-hud-runtime = { path = "src/crates/runtime" }
agent-hud-share = { path = "src/crates/share" }

base64 = "=0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
libc = "=0.2.191"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false }
objc2-foundation = { version = "=0.3.2", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tempfile = "3"

# Mac HUD panels are selected before allocation; see docs/tao-panel-patch.md.
[patch.crates-io]
tao = { git = "https://github.com/jazzenchen/tao", rev = "4a401fab5ba8a8b3c56b1e5c6970033a27509515" }
