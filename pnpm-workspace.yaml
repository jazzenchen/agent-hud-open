catalog:
  "@tailwindcss/vite": 4.3.3
  "@tauri-apps/api": 2.12.4
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  lucide-react: 1.59.0
  motion: 14.3.0
  radix-ui: 1.8.1
  react: 19.3.1
  react-dom: 19.3.1
  sonner: 2.0.8
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vite: 8.3.4

allowBuilds:
  esbuild: true
