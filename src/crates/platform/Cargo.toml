[package]
name = "agent-hud-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
agent-hud-core.workspace = true
agent-hud-agents.workspace = true
serde.workspace = true
serde_json.workspace = true
notify = "=8.2.0"
chrono.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls", "gzip", "socks", "system-proxy"] }
rusqlite.workspace = true
base64.workspace = true
sha2.workspace = true
serde-saphyr = "1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
plist = "=1.10.1"
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSRunningApplication"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSString", "NSUserDefaults", "NSData", "NSDictionary"] }

[target.'cfg(target_os = "windows")'.dependencies]
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "time", "io-util", "macros"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
